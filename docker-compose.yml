services:
  proxy-guard:
    image: ubuntu/squid:latest
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
    networks:
      default:
      secure_net:
        ipv4_address: ${PROXY_IP:-10.50.0.5}

  api_bridge:
    image: alpine/socat
    ports:
      - "127.0.0.1:${API_PORT:-8082}:8080" 
    command: tcp-listen:8080,fork,reuseaddr tcp-connect:claude-sandbox:8080
    networks:
      - default
      - secure_net
    depends_on:
      - claude-sandbox

  claude-sandbox:
    image: ${SANDBOX_IMAGE:-claude-sandbox-image}
    runtime: kata-runtime
    deploy:
      resources:
        limits:
          memory: 32G
          cpus: '8'
    environment:
      - HTTP_PROXY=http://${PROXY_IP:-10.50.0.5}:3128
      - HTTPS_PROXY=http://${PROXY_IP:-10.50.0.5}:3128
      - GLOBAL_AGENT_HTTP_PROXY=http://${PROXY_IP:-10.50.0.5}:3128
      - http_proxy=http://${PROXY_IP:-10.50.0.5}:3128
      - https_proxy=http://${PROXY_IP:-10.50.0.5}:3128
      - NO_PROXY=localhost,127.0.0.1,0.0.0.0
      - no_proxy=localhost,127.0.0.1,0.0.0.0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CODE_SERVER_PORT=${CODE_SERVER_PORT:-8081}
    volumes:
      - ${TARGET_REPO_ABS}:/workspace/readonly_repo:ro
      - ~/claude-setup/plugins:/workspace/readonly_plugin:ro
      - ~/claude-setup/settings:/workspace/claude_settings:ro      
      - ./entrypoint-generic.sh:/entrypoint.sh:ro
    networks:
      - secure_net
    stdin_open: true 
    tty: true        
    command: bash /entrypoint.sh

  admin_bridge:
    image: alpine/socat
    ports:
      - "127.0.0.1:${ADMIN_PORT:-9001}:9000"
    command: tcp-listen:9000,fork,reuseaddr tcp-connect:claude-sandbox:9000
    networks:
      - default
      - secure_net
    depends_on:
      - claude-sandbox

  ui_bridge:
    image: alpine/socat
    ports:
      - "${UI_PORT:-8081}:8081"
    command: tcp-listen:8081,fork,reuseaddr tcp-connect:claude-sandbox:8081
    networks:
      - default
      - secure_net
    depends_on:
      - claude-sandbox

networks:
  secure_net:
    internal: true
    ipam:
      config:
        - subnet: ${SUBNET_CIDR:-10.50.0.0/16}