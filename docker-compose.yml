services:
  proxy_guard:
    image: ubuntu/squid:latest
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
    networks:
      - default
      - secure_net

  api_bridge:
    image: alpine/socat
    ports:
      # Parameterized port, defaults to 8082 if API_PORT is not set
      - "127.0.0.1:${API_PORT:-8082}:8080" 
    command: tcp-listen:8080,fork,reuseaddr tcp-connect:claude-sandbox:8080
    networks:
      - default
      - secure_net
    depends_on:
      - claude-sandbox

  claude-sandbox:
    image: ${SANDBOX_IMAGE:-claude-sandbox-image}
    runtime: kata-runtime
    deploy:
      resources:
        limits:
          memory: 32G
          cpus: '8'
    environment:
      # Relying on internal Docker DNS instead of a hardcoded IP
      - HTTP_PROXY=http://proxy_guard:3128
      - HTTPS_PROXY=http://proxy_guard:3128
      - GLOBAL_AGENT_HTTP_PROXY=http://proxy_guard:3128
      - http_proxy=http://proxy_guard:3128
      - https_proxy=http://proxy_guard:3128
      - NO_PROXY=localhost,127.0.0.1,0.0.0.0
      - no_proxy=localhost,127.0.0.1,0.0.0.0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CODE_SERVER_PORT=8081
    volumes:
      - ${TARGET_REPO_ABS}:/workspace/readonly_repo:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
    networks:
      - secure_net
    stdin_open: true 
    tty: true        
    command: bash /entrypoint.sh

  admin_bridge:
    image: alpine/socat
    ports:
      - "127.0.0.1:${ADMIN_PORT:-9001}:9000"
    command: tcp-listen:9000,fork,reuseaddr tcp-connect:claude-sandbox:9000
    networks:
      - default
      - secure_net
    depends_on:
      - claude-sandbox

  ui_bridge:
    image: alpine/socat
    ports:
      - "${UI_PORT:-8081}:8081"
    command: tcp-listen:8081,fork,reuseaddr tcp-connect:claude-sandbox:8081
    networks:
      - default
      - secure_net
    depends_on:
      - claude-sandbox

networks:
  secure_net:
    internal: true
    # Removed the ipam block to let Docker dynamically handle subnets for each project